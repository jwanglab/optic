[workspace]
resolver = "2"
members = ["crates/optic-core", "crates/optic", "crates/blitzgz", "crates/optic-train"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
